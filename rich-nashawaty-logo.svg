<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <title>Rich Nashawaty logo</title>

  <!-- Background -->
  <rect width="400" height="400" fill="#181816"/>

  <!-- Accent bar top-left -->
