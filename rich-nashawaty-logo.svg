  <!-- Main name -->
  <text x="40" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="400" fill="#f4f1ea" letter-spacing="-1">Rich Nashawaty</text>

  <!-- Accent dot -->
  <text x="358" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="400" fill="#c8f060">.</text>

  <!-- Divider line -->
  <rect x="40" y="216" width="320" height="1" fill="rgba(255,255,255,0.12)"/>

  <!-- Tagline -->
  <text x="40" y="244" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="400" fill="#7a7672" letter-spacing="0.08em">SEO · AI CONSULTING · BOSTON, MA</text>

  <!-- Bottom accent -->
  <rect x="40" y="340" width="320" height="1" fill="rgba(255,255,255,0.08)"/>
  <text x="40" y="362" font-family="'Courier New', Courier, monospace" font-size="11" fill="#c8f060" letter-spacing="0.12em">RICHNASHAWATY.COM</text>
